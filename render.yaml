# Render Blueprint: one-click cloud Centauri (in YOUR Render account).
# The "Deploy to Render" button on the website points at this file.
services:
  - type: web
    name: centauri
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: CENTAURI_TOKEN
        generateValue: true   # Render creates a strong token; find it in the dashboard
      - key: CENTAURI_READ_TOKEN
        generateValue: true   # read-only token: the one to give cloud assistants (Claude, Muse) at /mcp
    disk:
      name: centauri-data
      mountPath: /data
      sizeGB: 1

  # The API gateway with a perfect memory — single port: proxied routes win,
  # everything else serves the admin dashboard (token-gated). Demo-ready.
  - type: web
    name: centauri-gateway
    runtime: docker
    plan: starter
    healthCheckPath: /livez
    dockerCommand: gateway -data /data/gateway.log -addr :7771 -admin-inline
    envVars:
      - key: CENTAURI_TOKEN
        generateValue: true   # admin dashboard token; find it in the dashboard
      # LLM routes name a provider's key by environment variable (auth_env) — the secret lives here, never in a
      # fact. Fill the ones your route uses in the Render dashboard; an empty value just means that provider is
      # skipped in the failover order. (A local model runtime is not something this container has: list it as a
      # provider only where the gateway runs next to one.)
      - key: OPENAI_API_KEY
        sync: false           # set in the dashboard: used by providers with auth_env: OPENAI_API_KEY
      - key: GEMINI_API_KEY
        sync: false           # set in the dashboard: used by providers with auth_env: GEMINI_API_KEY (OpenAI-compatible endpoint)
    disk:
      name: centauri-gateway-data
      mountPath: /data
      sizeGB: 1
